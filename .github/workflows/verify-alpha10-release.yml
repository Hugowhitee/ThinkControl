name: Verify alpha.10 release

on:
  pull_request:
    paths:
      - ".github/workflows/verify-alpha10-release.yml"

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Wait for published release and verify assets
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          tag="v0.1.0-alpha.10"
          repo="$GITHUB_REPOSITORY"

          for attempt in $(seq 1 30); do
            if gh release view "$tag" --repo "$repo" --json tagName,isPrerelease,publishedAt,assets > release.json 2>/dev/null; then
              break
            fi
            if [[ "$attempt" == "30" ]]; then
              echo "Release $tag did not become visible within the verification window."
              exit 1
            fi
            echo "Waiting for $tag release publication ($attempt/30)…"
            sleep 10
          done

          python - <<'PY'
          import json
          r=json.load(open('release.json', encoding='utf-8'))
          assert r['tagName']=='v0.1.0-alpha.10', r
          assert r['isPrerelease'] is True, r
          names={a['name'] for a in r.get('assets', [])}
          expected={
              'ThinkControl-Setup-0.1.0-alpha.10.exe',
              'ThinkControl-Payload-0.1.0-alpha.10.zip',
              'SHA256SUMS.txt',
              'compact-dark.png',
              'advanced-home.png',
              'advanced-touchpad.png',
              'advanced-sensors.png',
          }
          missing=expected-names
          assert not missing, f'Missing release assets: {sorted(missing)}; present: {sorted(names)}'
          print('Published:', r.get('publishedAt'))
          print('Assets:', ', '.join(sorted(expected)))
          PY

          mkdir release-assets
          gh release download "$tag" --repo "$repo" --dir release-assets \
            --pattern 'ThinkControl-Setup-0.1.0-alpha.10.exe' \
            --pattern 'ThinkControl-Payload-0.1.0-alpha.10.zip' \
            --pattern 'SHA256SUMS.txt' \
            --pattern 'compact-dark.png' \
            --pattern 'advanced-home.png' \
            --pattern 'advanced-touchpad.png' \
            --pattern 'advanced-sensors.png'

          cd release-assets
          python - <<'PY'
          from pathlib import Path
          import hashlib

          expected={}
          for raw in Path('SHA256SUMS.txt').read_text(encoding='ascii').splitlines():
              raw=raw.strip()
              if not raw: continue
              h,name=raw.split(None,1)
              expected[name.strip().lstrip('*')]=h.lower()

          binaries=['ThinkControl-Setup-0.1.0-alpha.10.exe','ThinkControl-Payload-0.1.0-alpha.10.zip']
          for name in binaries:
              p=Path(name)
              assert p.is_file() and p.stat().st_size>0, name
              actual=hashlib.sha256(p.read_bytes()).hexdigest()
              assert expected.get(name)==actual, f'SHA256 mismatch for {name}: {actual} != {expected.get(name)}'
              print(f'{name}: {actual}')

          for name in ['compact-dark.png','advanced-home.png','advanced-touchpad.png','advanced-sensors.png']:
              p=Path(name)
              assert p.is_file(), name
              assert p.stat().st_size>=5000, f'{name} unexpectedly small: {p.stat().st_size}'
              assert p.read_bytes()[:8] == b'\x89PNG\r\n\x1a\n', f'{name} is not a PNG'
              print(f'{name}: {p.stat().st_size} bytes')
          PY
