name: Finalize fan curve provider copy

on:
  push:
    branches:
      - fix/x9-dual-fan-control-stability

permissions:
  contents: write

jobs:
  patch:
    if: ${{ !contains(github.event.head_commit.message, '[curve-copy-finalize]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: fix/x9-dual-fan-control-stability
          fetch-depth: 1

      - name: Apply provider-aware fan curve copy
        shell: python
        run: |
          from pathlib import Path
          p = Path('src/ThinkControl.UI/FanCurveEditorWindow.cs')
          text = p.read_text(encoding='utf-8')
          old = '''        bool x9Ec = DeviceCapabilityExpectations.IsVerifiedX9(_app.State.MachineType);\n        var subtitle = new TextBlock\n        {\n            Text = x9Ec\n                ? "Tune temperature against a real 0–100% target. ThinkControl maps the graph to measured X9 EC states after calibration; 100% uses the physically verified maximum, EC step 7."\n                : "Tune temperature against the active fan provider's verified 0–100% target range. ThinkControl does not assume EC steps or PWM when the provider does not expose them.",\n'''
          new = '''        bool oemTargetRpm = string.Equals(_app.State.FanControlKind, FanControlKinds.OemTargetRpm, StringComparison.OrdinalIgnoreCase);\n        bool x9Ec = string.Equals(_app.State.FanControlKind, FanControlKinds.DiscreteEc, StringComparison.OrdinalIgnoreCase);\n        var subtitle = new TextBlock\n        {\n            Text = oemTargetRpm\n                ? "Tune temperature against Lenovo OEM target-RPM control. The graph sends continuous per-fan RPM targets across Lenovo's verified reference range; Auto returns ownership to Lenovo firmware."\n                : x9Ec\n                    ? "Tune temperature against the verified X9 EC fallback. ThinkControl maps the graph to calibrated discrete EC states; this fallback is not treated as Lenovo Auto's absolute fan ceiling."\n                    : "Tune temperature against the active fan provider's verified 0–100% target range. ThinkControl does not assume EC steps or PWM when the provider does not expose them.",\n'''
          if text.count(old) != 1:
              raise RuntimeError(f'expected one legacy subtitle block, found {text.count(old)}')
          p.write_text(text.replace(old, new, 1), encoding='utf-8', newline='\n')

      - name: Remove temporary workflow and commit
        shell: bash
        run: |
          git rm .github/workflows/zz-finalize-fan-curve-copy.yml
          git config user.name "ThinkControl Release Bot"
          git config user.email "actions@users.noreply.github.com"
          git add src/ThinkControl.UI/FanCurveEditorWindow.cs
          git commit -m "Show fan curve semantics for the active provider [curve-copy-finalize]"
          git push origin HEAD:fix/x9-dual-fan-control-stability
