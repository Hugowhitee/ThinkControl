name: Finalize alpha.14.1 packaging once

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/release-hotfix-once.yml"

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Apply immutable-release packaging correction
        shell: python
        run: |
          from pathlib import Path
          import json

          version_path = Path("version.json")
          metadata = json.loads(version_path.read_text(encoding="utf-8"))
          if metadata.get("version") != "0.1.0-alpha.14":
              raise SystemExit(f"Expected alpha.14 metadata, found {metadata.get('version')!r}")
          metadata["version"] = "0.1.0-alpha.14.1"
          metadata["releaseReady"] = True
          version_path.write_text(json.dumps(metadata, indent=2) + "\n", encoding="utf-8")

          release_path = Path(".github/workflows/release.yml")
          release = release_path.read_text(encoding="utf-8")

          needle = '$payload = Get-Item $env:PAYLOAD_PATH\n          $args = @('
          replacement = '$payload = Get-Item $env:PAYLOAD_PATH\n          $overview = Join-Path "artifacts/release-previews" \'ui-overview.png\'\n          if (-not (Test-Path $overview)) { throw "Release overview is missing" }\n          $args = @('
          if needle not in release:
              raise SystemExit("Expected payload/release-args block was not found")
          release = release.replace(needle, replacement, 1)

          asset_needle = "'artifacts/installer/SHA256SUMS.txt',\n            '--title'"
          asset_replacement = "'artifacts/installer/SHA256SUMS.txt',\n            $overview,\n            '--title'"
          if asset_needle not in release:
              raise SystemExit("Expected release asset list was not found")
          release = release.replace(asset_needle, asset_replacement, 1)
          release_path.write_text(release, encoding="utf-8")

          promote_path = Path(".github/workflows/promote-release.yml")
          promote = promote_path.read_text(encoding="utf-8")
          old_concurrency = "  cancel-in-progress: false"
          if old_concurrency not in promote:
              raise SystemExit("Expected promotion concurrency setting was not found")
          promote_path.write_text(promote.replace(old_concurrency, "  cancel-in-progress: true", 1), encoding="utf-8")

          Path(".github/workflows/release-hotfix-once.yml").unlink()

      - name: Commit corrected release pipeline
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "Hugo"
          git config user.email "119423227+Hugowhitee@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "Publish alpha.14.1 with complete immutable assets"
          git push origin HEAD:main
