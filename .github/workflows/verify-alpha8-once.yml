name: Verify published alpha.8 once

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/verify-alpha8-once.yml

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Wait for release and verify assets
        id: verify
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: v0.1.0-alpha.8
        shell: bash
        run: |
          set -euo pipefail

          expected_commit=$(git rev-parse HEAD^)
          echo "Expected release commit: $expected_commit"

          for attempt in $(seq 1 40); do
            if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
              break
            fi
            if [[ "$attempt" == "40" ]]; then
              echo "Release $TAG did not become visible in time" >&2
              exit 1
            fi
            echo "Waiting for $TAG release ($attempt/40)..."
            sleep 15
          done

          git fetch origin "refs/tags/$TAG:refs/tags/$TAG" --force
          tag_commit=$(git rev-list -n 1 "$TAG")
          if [[ "$tag_commit" != "$expected_commit" ]]; then
            echo "Tag points to $tag_commit, expected $expected_commit" >&2
            exit 1
          fi

          tag_name=$(gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json tagName --jq '.tagName')
          prerelease=$(gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json isPrerelease --jq '.isPrerelease')
          release_name=$(gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json name --jq '.name')
          if [[ "$tag_name" != "$TAG" || "$prerelease" != "true" ]]; then
            echo "Release metadata is wrong: tag=$tag_name prerelease=$prerelease" >&2
            exit 1
          fi

          dir="$RUNNER_TEMP/thinkcontrol-alpha8-release"
          mkdir -p "$dir"
          gh release download "$TAG" --repo "$GITHUB_REPOSITORY" --dir "$dir"

          required=(
            'ThinkControl-Setup-0.1.0-alpha.8.exe'
            'ThinkControl-Payload-0.1.0-alpha.8.zip'
            'SHA256SUMS.txt'
            'compact-dark.png'
            'advanced-home.png'
            'advanced-touchpad.png'
            'advanced-sensors.png'
          )
          for name in "${required[@]}"; do
            test -s "$dir/$name" || { echo "Missing/empty release asset: $name" >&2; exit 1; }
          done

          (cd "$dir" && sha256sum -c SHA256SUMS.txt) | tee "$RUNNER_TEMP/hash-check.txt"

          mkdir -p docs/release-verification
          {
            echo '# ThinkControl v0.1.0-alpha.8 release verification'
            echo
            echo "- Tag: \`$TAG\`"
            echo "- Release: \`$release_name\`"
            echo '- Prerelease: `true`'
            echo "- Tagged commit: \`$tag_commit\`"
            echo '- Verified by GitHub Actions after publication.'
            echo '- Installer and payload match `SHA256SUMS.txt`.'
            echo '- Required WPF release preview assets are present and non-empty.'
            echo
            echo '## Required assets'
            echo
            for name in "${required[@]}"; do
              bytes=$(stat -c '%s' "$dir/$name")
              echo "- \`$name\` — $bytes bytes"
            done
            echo
            echo '## SHA-256 verification'
            echo
            echo '```text'
            cat "$RUNNER_TEMP/hash-check.txt"
            echo '```'
          } > docs/release-verification/v0.1.0-alpha.8.md

      - name: Commit verification evidence and remove one-shot workflow
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs/release-verification/v0.1.0-alpha.8.md
          git rm .github/workflows/verify-alpha8-once.yml
          git commit -m 'Verify published ThinkControl alpha.8 release'
          git push origin HEAD:main
