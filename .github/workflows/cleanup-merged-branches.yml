name: Cleanup merged branches

on:
  pull_request:
    types: [closed]
  push:
    branches:
      - feature/alpha6-hardware-ux

permissions:
  contents: write

jobs:
  cleanup-merged:
    if: >-
      github.event_name == 'pull_request' &&
      github.event.pull_request.merged == true &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.head.ref != github.event.repository.default_branch
    runs-on: ubuntu-latest
    steps:
      - name: Delete merged branch
        env:
          GH_TOKEN: ${{ github.token }}
          BRANCH: ${{ github.event.pull_request.head.ref }}
        run: |
          encoded=$(python3 - <<'PY'
          import os, urllib.parse
          print(urllib.parse.quote(os.environ['BRANCH'], safe=''))
          PY
          )
          status=$(curl -sS -o /tmp/delete-response -w '%{http_code}' \
            -X DELETE \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/git/refs/heads/${encoded}")
          if [ "$status" = "204" ] || [ "$status" = "422" ] || [ "$status" = "404" ]; then
            echo "Merged branch cleanup complete (${status})."
            exit 0
          fi
          cat /tmp/delete-response
          exit 1

  cleanup-legacy-alpha5:
    if: github.event_name == 'push' && github.ref == 'refs/heads/feature/alpha6-hardware-ux'
    runs-on: ubuntu-latest
    steps:
      - name: Delete legacy branch only when identical to main
        env:
          GH_TOKEN: ${{ github.token }}
          LEGACY: feature/alpha5-touchpad-updater-hardware
        run: |
          set -euo pipefail
          api="https://api.github.com/repos/${GITHUB_REPOSITORY}"
          auth=(-H "Authorization: Bearer ${GH_TOKEN}" -H "Accept: application/vnd.github+json" -H "X-GitHub-Api-Version: 2022-11-28")

          legacy_sha=$(curl -fsS "${auth[@]}" "$api/git/ref/heads/${LEGACY}" | python3 -c 'import json,sys; print(json.load(sys.stdin)["object"]["sha"])') || exit 0
          main_sha=$(curl -fsS "${auth[@]}" "$api/git/ref/heads/main" | python3 -c 'import json,sys; print(json.load(sys.stdin)["object"]["sha"])')

          if [ "$legacy_sha" != "$main_sha" ]; then
            echo "Refusing to delete ${LEGACY}: ${legacy_sha} != main ${main_sha}"
            exit 1
          fi

          encoded=$(python3 - <<'PY'
          import os, urllib.parse
          print(urllib.parse.quote(os.environ['LEGACY'], safe=''))
          PY
          )
          status=$(curl -sS -o /tmp/delete-response -w '%{http_code}' -X DELETE "${auth[@]}" "$api/git/refs/heads/${encoded}")
          if [ "$status" = "204" ] || [ "$status" = "404" ]; then
            echo "Deleted ${LEGACY} (${status})."
            exit 0
          fi
          cat /tmp/delete-response
          exit 1
