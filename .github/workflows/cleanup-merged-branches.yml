name: Cleanup merged branches

on:
  pull_request:
    types: [closed]

permissions:
  contents: write

jobs:
  cleanup:
    if: >-
      github.event.pull_request.merged == true &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.head.ref != github.event.repository.default_branch
    runs-on: ubuntu-latest
    steps:
      - name: Delete merged branch
        env:
          GH_TOKEN: ${{ github.token }}
          BRANCH: ${{ github.event.pull_request.head.ref }}
        run: |
          encoded=$(python3 - <<'PY'
          import os, urllib.parse
          print(urllib.parse.quote(os.environ['BRANCH'], safe=''))
          PY
          )
          status=$(curl -sS -o /tmp/delete-response -w '%{http_code}' \
            -X DELETE \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/git/refs/heads/${encoded}")
          if [ "$status" = "204" ] || [ "$status" = "422" ] || [ "$status" = "404" ]; then
            echo "Merged branch cleanup complete (${status})."
            exit 0
          fi
          cat /tmp/delete-response
          exit 1
