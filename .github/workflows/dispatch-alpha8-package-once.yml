name: Dispatch alpha.8 package once

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/dispatch-alpha8-package-once.yml

permissions:
  actions: write
  contents: read

jobs:
  dispatch:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Dispatch release workflow at alpha.8 tag
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          gh workflow run release.yml --repo "$GITHUB_REPOSITORY" --ref v0.1.0-alpha.8
          echo 'Dispatched Package ThinkControl at v0.1.0-alpha.8'
