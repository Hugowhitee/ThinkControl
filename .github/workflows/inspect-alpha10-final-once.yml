name: Inspect final alpha.10 release state once

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/inspect-alpha10-final-once.yml"

permissions:
  contents: read
  pull-requests: write

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - name: Report alpha.10 assets
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          result=$(gh release view v0.1.0-alpha.10 --repo "$GITHUB_REPOSITORY" --json assets,isPrerelease --jq '"prerelease=" + (.isPrerelease|tostring) + "; assets=" + ([.assets[].name] | sort | join(", "))')
          gh pr comment 35 --repo "$GITHUB_REPOSITORY" --body "Final alpha.10 read-only check: $result"
