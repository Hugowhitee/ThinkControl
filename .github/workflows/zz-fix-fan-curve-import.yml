name: Fix fan curve IPC import

on:
  push:
    branches:
      - fix/x9-dual-fan-control-stability

permissions:
  contents: write

jobs:
  patch:
    if: ${{ !contains(github.event.head_commit.message, '[fan-curve-import]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: fix/x9-dual-fan-control-stability
          fetch-depth: 1
      - name: Add IPC namespace
        shell: python
        run: |
          from pathlib import Path
          p = Path('src/ThinkControl.UI/FanCurveEditorWindow.cs')
          text = p.read_text(encoding='utf-8')
          old = 'using ThinkControl.Core.Cooling;\nusing ThinkControl.UI.Services;\n'
          new = 'using ThinkControl.Core.Cooling;\nusing ThinkControl.Core.Ipc;\nusing ThinkControl.UI.Services;\n'
          if text.count(old) != 1:
              raise RuntimeError(f'expected one using block, found {text.count(old)}')
          p.write_text(text.replace(old, new, 1), encoding='utf-8', newline='\n')
      - name: Remove temporary workflow and commit
        shell: bash
        run: |
          git rm .github/workflows/zz-fix-fan-curve-import.yml
          git config user.name "ThinkControl Release Bot"
          git config user.email "actions@users.noreply.github.com"
          git add src/ThinkControl.UI/FanCurveEditorWindow.cs
          git commit -m "Import fan-control contract in curve editor [fan-curve-import]"
          git push origin HEAD:fix/x9-dual-fan-control-stability
