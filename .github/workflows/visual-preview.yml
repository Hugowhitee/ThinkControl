name: Publish Visual Preview

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish:
    if: github.ref == 'refs/heads/main'
    runs-on: windows-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Restore and build
        shell: pwsh
        run: |
          dotnet restore ThinkControl.slnx
          if ($LASTEXITCODE -ne 0) { throw 'Restore failed' }
          dotnet build ThinkControl.slnx -c Release --no-restore
          if ($LASTEXITCODE -ne 0) { throw 'Build failed' }

      - name: Render visual preview
        shell: pwsh
        run: |
          $output = Join-Path $PWD 'artifacts\visual-main'
          dotnet run --project tools/ThinkControl.Snapshots/ThinkControl.Snapshots.csproj `
            -c Release `
            --no-build `
            -- $output
          if ($LASTEXITCODE -ne 0) { throw 'Visual preview renderer failed' }

      - name: Publish generated screenshots branch
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $source = Join-Path $PWD 'artifacts\visual-main'
          $temp = Join-Path $env:RUNNER_TEMP 'thinkcontrol-visual-main'
          if (Test-Path $temp) { Remove-Item $temp -Recurse -Force }
          New-Item -ItemType Directory -Force -Path $temp | Out-Null
          Copy-Item (Join-Path $source '*') $temp -Recurse -Force

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'

          git fetch origin visual-main
          if ($LASTEXITCODE -eq 0) {
            git checkout -B visual-main origin/visual-main
          }
          else {
            git checkout --orphan visual-main
          }

          git rm -rf . 2>$null
          Get-ChildItem -Force | Where-Object { $_.Name -ne '.git' } | Remove-Item -Recurse -Force
          Copy-Item (Join-Path $temp '*') $PWD -Recurse -Force

          git add -A
          $changes = git status --porcelain
          if ([string]::IsNullOrWhiteSpace(($changes -join ''))) {
            Write-Host 'Visual preview is unchanged.'
            exit 0
          }

          git commit -m "Update visual preview for $env:GITHUB_SHA"
          git push origin HEAD:visual-main --force
