name: Alpha.11 visual check once

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/alpha11-visual-check-once.yml"

permissions:
  contents: read
  issues: write
  pull-requests: write

jobs:
  render:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Restore
        run: dotnet restore ThinkControl.slnx

      - name: Build release
        run: dotnet build ThinkControl.slnx -c Release --no-restore

      - name: Render fresh WPF gallery
        shell: pwsh
        run: |
          $output = Join-Path $PWD "artifacts\snapshots"
          dotnet run --project tools/ThinkControl.Snapshots/ThinkControl.Snapshots.csproj --configuration Release --no-build -- $output
          if ($LASTEXITCODE -ne 0) { throw "Snapshot renderer failed" }
          foreach ($name in @('advanced-battery.png','gallery.html','manifest.json')) {
            $path = Join-Path $output $name
            if (-not (Test-Path $path)) { throw "Missing snapshot artifact: $name" }
          }

      - name: Upload battery visual QA
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: alpha11-battery-visual-${{ github.run_id }}
          path: |
            artifacts/snapshots/advanced-battery.png
            artifacts/snapshots/gallery.html
            artifacts/snapshots/manifest.json
          if-no-files-found: warn

      - name: Report run id
        if: always()
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh pr comment 35 --repo $env:GITHUB_REPOSITORY --body "Alpha.11 fresh visual check run: $env:GITHUB_RUN_ID · commit $env:GITHUB_SHA · conclusion available in Actions."

# Retrigger after the workflow already existed on main.
