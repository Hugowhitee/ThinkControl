name: Verify alpha.10 release assets once

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/publish-alpha10-existing-tag-once.yml"

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: alpha10-release-asset-cleanup
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      GH_TOKEN: ${{ github.token }}
      TAG: v0.1.0-alpha.10
      EXPECTED_SHA: d7e6f3d0c6b176163ae9352a9e7633b72bd51f05
    steps:
      - name: Verify tag and prerelease
        shell: bash
        run: |
          set -euo pipefail
          actual=$(gh api "repos/$GITHUB_REPOSITORY/commits/$TAG" --jq '.sha')
          test "$actual" = "$EXPECTED_SHA"
          gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null
          test "$(gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json isPrerelease --jq '.isPrerelease')" = "true"

      - name: Keep only updater assets
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t assets < <(gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json assets --jq '.assets[].name')
          for asset in "${assets[@]}"; do
            case "$asset" in
              ThinkControl-Setup-*.exe|ThinkControl-Payload-*.zip|SHA256SUMS.txt) ;;
              *) echo "Removing $asset"; gh release delete-asset "$TAG" "$asset" --repo "$GITHUB_REPOSITORY" --yes ;;
            esac
          done

          mapfile -t final < <(gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json assets --jq '.assets[].name' | sort)
          test "${#final[@]}" -eq 3
          printf '%s\n' "${final[@]}" | grep -Fxq 'SHA256SUMS.txt'
          printf '%s\n' "${final[@]}" | grep -Eq '^ThinkControl-Setup-0\.1\.0-alpha\.10\.exe$'
          printf '%s\n' "${final[@]}" | grep -Eq '^ThinkControl-Payload-0\.1\.0-alpha\.10\.zip$'
          printf 'Final assets: %s\n' "${final[*]}"

      - name: Report success
        if: success()
        shell: bash
        run: |
          gh pr comment 35 --repo "$GITHUB_REPOSITORY" --body "✅ alpha.10 release verified at $EXPECTED_SHA. Public assets are now exactly: ThinkControl-Setup-0.1.0-alpha.10.exe, ThinkControl-Payload-0.1.0-alpha.10.zip, SHA256SUMS.txt."

      - name: Report failure
        if: failure()
        shell: bash
        run: |
          gh pr comment 35 --repo "$GITHUB_REPOSITORY" --body "❌ alpha.10 release asset cleanup failed. The prerelease itself exists, but GitHub blocked or failed the cleanup step; no app source was changed by this run."
