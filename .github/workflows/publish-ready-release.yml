name: Publish ready release

# Idempotent publication guard: touching this workflow safely rechecks an existing
# ready tag and dispatches packaging only when the matching GitHub release is absent.
on:
  push:
    branches:
      - main
    paths:
      - version.json
      - .github/workflows/publish-ready-release.yml
  workflow_dispatch:

permissions:
  contents: write
  actions: write

jobs:
  tag-ready-version:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Resolve release metadata
        id: version
        shell: bash
        run: |
          set -euo pipefail
          version=$(jq -r '.version // empty' version.json)
          ready=$(jq -r '.releaseReady // false' version.json)
          if [[ -z "$version" ]]; then
            echo "version.json does not contain a version" >&2
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "tag=v$version" >> "$GITHUB_OUTPUT"
          echo "ready=$ready" >> "$GITHUB_OUTPUT"

      - name: Explain non-release build
        if: steps.version.outputs.ready != 'true'
        run: echo "version.json releaseReady is false; no release will be published."

      - name: Check whether tag already exists
        if: steps.version.outputs.ready == 'true'
        id: tagcheck
        shell: bash
        run: |
          set -euo pipefail
          tag='${{ steps.version.outputs.tag }}'
          if git ls-remote --exit-code --tags origin "refs/tags/$tag" >/dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
            echo "$tag already exists."
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Create exact version tag
        if: steps.version.outputs.ready == 'true' && steps.tagcheck.outputs.exists == 'false'
        shell: bash
        run: |
          set -euo pipefail
          tag='${{ steps.version.outputs.tag }}'
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a "$tag" "$GITHUB_SHA" -m "ThinkControl $tag"
          git push origin "$tag"
          echo "Created $tag."

      - name: Check whether GitHub release already exists
        if: steps.version.outputs.ready == 'true'
        id: releasecheck
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          tag='${{ steps.version.outputs.tag }}'
          if gh release view "$tag" >/dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
            echo "Release for $tag already exists; no packaging dispatch is needed."
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Dispatch tested package workflow on tag
        if: steps.version.outputs.ready == 'true' && steps.releasecheck.outputs.exists == 'false'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          tag='${{ steps.version.outputs.tag }}'
          # A tag pushed by GITHUB_TOKEN does not reliably trigger another push-based
          # workflow. workflow_dispatch is an explicit exception, so dispatch the
          # already-tested package workflow at the exact immutable release tag.
          gh workflow run release.yml --ref "$tag"
          echo "Dispatched Package ThinkControl for $tag."

      - name: Verify published release assets
        if: steps.version.outputs.ready == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          version='${{ steps.version.outputs.version }}'
          tag='${{ steps.version.outputs.tag }}'
          installer="ThinkControl-Setup-${version}.exe"
          checksum='SHA256SUMS.txt'
          verified='false'

          # Packaging includes a full install/service/uninstall smoke test, so a
          # newly dispatched tagged run can take a few minutes before assets appear.
          for attempt in $(seq 1 48); do
            if json=$(gh release view "$tag" --json name,tagName,isPrerelease,url,assets 2>/dev/null); then
              names=$(printf '%s' "$json" | jq -r '.assets[].name')
              if grep -Fxq "$installer" <<<"$names" && grep -Fxq "$checksum" <<<"$names"; then
                prerelease=$(printf '%s' "$json" | jq -r '.isPrerelease')
                if [[ "$prerelease" != 'true' ]]; then
                  echo "Release $tag exists but is not marked as a prerelease." >&2
                  exit 1
                fi

                title=$(printf '%s' "$json" | jq -r '.name')
                url=$(printf '%s' "$json" | jq -r '.url')
                jq -n \
                  --arg version "$version" \
                  --arg tag "$tag" \
                  --arg title "$title" \
                  --arg url "$url" \
                  --arg installer "$installer" \
                  --arg checksum "$checksum" \
                  '{version:$version,tag:$tag,title:$title,url:$url,prerelease:true,installer:$installer,checksum:$checksum,verifiedAtUtc:(now|todateiso8601)}' \
                  > "$RUNNER_TEMP/release-status.json"
                verified='true'
                echo "Verified $installer and $checksum on $tag."
                break
              fi
            fi

            echo "Release assets not complete yet (attempt $attempt/48)."
            sleep 10
          done

          if [[ "$verified" != 'true' ]]; then
            echo "Timed out waiting for the exact release assets for $tag." >&2
            exit 1
          fi

      - name: Record verified release status
        if: steps.version.outputs.ready == 'true'
        shell: bash
        run: |
          set -euo pipefail
          test -f "$RUNNER_TEMP/release-status.json"
          mkdir -p .github
          cp "$RUNNER_TEMP/release-status.json" .github/release-status.json

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github/release-status.json
          if git diff --cached --quiet; then
            echo "Release verification marker is already current."
            exit 0
          fi

          git commit -m "Record verified ThinkControl release"
          git pull --rebase origin main
          git push origin HEAD:main
