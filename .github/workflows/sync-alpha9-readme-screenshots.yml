name: Sync alpha.9 README screenshots

on:
  push:
    branches: [feature/alpha8-performance-hardware]

permissions:
  contents: write

jobs:
  sync:
    if: ${{ !contains(github.event.head_commit.message, '[skip screenshot-sync]') }}
    runs-on: windows-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/alpha8-performance-hardware

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Restore and build
        shell: pwsh
        run: |
          dotnet restore ThinkControl.slnx
          dotnet build ThinkControl.slnx --configuration Release --no-restore

      - name: Render current WPF screenshots
        shell: pwsh
        run: |
          $output = Join-Path $PWD 'artifacts\snapshots'
          dotnet run --project tools/ThinkControl.Snapshots/ThinkControl.Snapshots.csproj --configuration Release --no-build -- $output
          if ($LASTEXITCODE -ne 0) { throw 'Snapshot renderer failed' }

          $map = @{
            'compact-dark.png' = 'compact-dark.png'
            'advanced-home.png' = 'advanced-home.png'
            'advanced-touchpad.png' = 'advanced-touchpad.png'
            'advanced-audio.png' = 'advanced-audio.png'
            'advanced-battery.png' = 'advanced-battery.png'
          }
          New-Item -ItemType Directory -Force -Path docs\screenshots | Out-Null
          foreach ($entry in $map.GetEnumerator()) {
            Copy-Item (Join-Path $output $entry.Key) (Join-Path 'docs\screenshots' $entry.Value) -Force
          }

      - name: Commit exact alpha.9 README previews
        shell: pwsh
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs/screenshots/compact-dark.png docs/screenshots/advanced-home.png docs/screenshots/advanced-touchpad.png docs/screenshots/advanced-audio.png docs/screenshots/advanced-battery.png
          if (git diff --cached --quiet) {
            Write-Host 'README screenshots already match this build.'
            exit 0
          }
          git commit -m 'Refresh alpha.9 README screenshots [skip screenshot-sync]'
          git push origin HEAD:feature/alpha8-performance-hardware
