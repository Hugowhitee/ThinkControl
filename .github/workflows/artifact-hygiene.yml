name: Actions artifact hygiene

on:
  workflow_dispatch:
  schedule:
    - cron: "23 4 * * *"

permissions:
  contents: read
  actions: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Remove ephemeral artifacts older than 7 days
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          cutoff=$(date -u -d '7 days ago' +%s)
          page=1
          deleted=0

          while :; do
            response=$(gh api "repos/$GITHUB_REPOSITORY/actions/artifacts?per_page=100&page=$page")
            count=$(jq '.artifacts | length' <<<"$response")
            [[ "$count" -eq 0 ]] && break

            while IFS=$'\t' read -r id name created expired; do
              [[ -z "$id" ]] && continue
              created_epoch=$(date -u -d "$created" +%s)
              if [[ "$expired" == "true" || "$created_epoch" -lt "$cutoff" ]]; then
                echo "Deleting ephemeral Actions artifact $name ($id), created $created"
                gh api --method DELETE "repos/$GITHUB_REPOSITORY/actions/artifacts/$id"
                deleted=$((deleted + 1))
              fi
            done < <(jq -r '.artifacts[] | [.id, .name, .created_at, .expired] | @tsv' <<<"$response")

            [[ "$count" -lt 100 ]] && break
            page=$((page + 1))
          done

          echo "Deleted $deleted old Actions artifact(s). GitHub Release assets are not touched by this workflow."
