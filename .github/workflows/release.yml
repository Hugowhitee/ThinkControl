name: Package ThinkControl

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "src/**"
      - "installer/**"
      - "assets/brand/**"
      - "README.md"
      - "version.json"
      - ".github/workflows/release.yml"
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  package:
    runs-on: windows-latest
    timeout-minutes: 25

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Resolve version
        shell: pwsh
        run: |
          $metadata = Get-Content "version.json" -Raw | ConvertFrom-Json
          $sourceVersion = [string]$metadata.version
          if ([string]::IsNullOrWhiteSpace($sourceVersion)) {
            throw "version.json does not contain a version"
          }

          if ($env:GITHUB_REF -like 'refs/tags/v*') {
            $version = $env:GITHUB_REF_NAME.TrimStart('v')
            if ($version -ne $sourceVersion) {
              throw "Release tag '$env:GITHUB_REF_NAME' does not match version.json ('v$sourceVersion'). Update version.json first."
            }
            "VERSIONED_RELEASE=1" | Out-File $env:GITHUB_ENV -Encoding utf8 -Append
          }
          else {
            $version = "$sourceVersion-dev.$env:GITHUB_RUN_NUMBER"
            "VERSIONED_RELEASE=0" | Out-File $env:GITHUB_ENV -Encoding utf8 -Append
          }

          $coreVersion = $sourceVersion.Split('-')[0]
          $build = [int]$env:GITHUB_RUN_NUMBER % 65535
          $numericVersion = "$coreVersion.$build"
          "SOURCE_VERSION=$sourceVersion" | Out-File $env:GITHUB_ENV -Encoding utf8 -Append
          "APP_VERSION=$version" | Out-File $env:GITHUB_ENV -Encoding utf8 -Append
          "NUMERIC_VERSION=$numericVersion" | Out-File $env:GITHUB_ENV -Encoding utf8 -Append
          Write-Host "ThinkControl version: $version"

      - name: Verify canonical v3 branding
        shell: pwsh
        run: |
          $pairs = @(
            @('assets/brand/v3/windows/ThinkControl.ico', 'src/ThinkControl.UI/Assets/ThinkControl.ico'),
            @('assets/brand/v3/windows/ThinkControl_mark.ico', 'src/ThinkControl.UI/Assets/tray.ico')
          )
          foreach ($pair in $pairs) {
            $source = (Get-FileHash $pair[0] -Algorithm SHA256).Hash
            $target = (Get-FileHash $pair[1] -Algorithm SHA256).Hash
            if ($source -ne $target) {
              throw "Branding drift: $($pair[1]) is not the exact v3 source asset."
            }
          }

          $wordmarkDir = 'assets/brand/v3/wordmark'
          $canonicalWordmarks = @(
            "$wordmarkDir/ThinkControl_wordmark_dark.svg",
            "$wordmarkDir/ThinkControl_wordmark_light.svg"
          )
          foreach ($wordmarkPath in $canonicalWordmarks) {
            if (-not (Test-Path $wordmarkPath)) {
              throw "Canonical wordmark is missing: $wordmarkPath"
            }
            $wordmark = Get-Content $wordmarkPath -Raw
            if ($wordmark -notmatch 'viewBox="0 0 455 144"' -or
                $wordmark -notmatch 'translate\(203\.500947 33\.452652\)' -or
                $wordmark -notmatch 'translate\(-6 -0\.5\)') {
              throw "Canonical wordmark alignment drifted: $wordmarkPath"
            }
          }

          $duplicateWordmarks = Get-ChildItem $wordmarkDir -File | Where-Object {
            $_.Name -match '^ThinkControl_wordmark_(outlined|refined)_' -or $_.Name -eq 'REFINEMENT.md'
          }
          if ($duplicateWordmarks) {
            throw "Legacy or duplicate wordmark assets remain: $($duplicateWordmarks.Name -join ', ')"
          }

          $legacyDocAssets = @(
            'docs/assets/thinkcontrol-logo-dark.svg',
            'docs/assets/thinkcontrol-logo-light.svg'
          ) | Where-Object { Test-Path $_ }
          if ($legacyDocAssets) {
            throw "Legacy documentation logo copies remain: $($legacyDocAssets -join ', ')"
          }

          $readme = Get-Content 'README.md' -Raw
          if ($readme -notmatch 'ThinkControl_wordmark_dark\.svg' -or
              $readme -notmatch 'ThinkControl_wordmark_light\.svg' -or
              $readme -match 'wordmark_(outlined|refined)' -or
              $readme -match 'docs/assets/thinkcontrol-logo') {
            throw 'README does not use the canonical wordmark assets exclusively.'
          }

          $brandMark = Get-Content 'src/ThinkControl.UI/Controls/BrandMark.xaml' -Raw
          if ($brandMark -match 'Canvas Width="64"' -or $brandMark -match 'M7,9') {
            throw 'Legacy hand-drawn TC geometry is still present in BrandMark.xaml.'
          }
          if ($brandMark -notmatch 'Canvas Width="1536"' -or $brandMark -notmatch 'Canvas.Left="1219.07"') {
            throw 'BrandMark.xaml does not contain the exact v3 master geometry.'
          }

          $brandWordmark = Get-Content 'src/ThinkControl.UI/Controls/BrandWordmark.xaml' -Raw
          if ($brandWordmark -notmatch 'Canvas Width="455"' -or
              $brandWordmark -notmatch 'Canvas.Left="203\.500947"' -or
              $brandWordmark -notmatch 'Canvas.Top="33\.452652"' -or
              $brandWordmark -notmatch 'TranslateTransform X="-6" Y="-0\.5"') {
            throw 'WPF wordmark layout does not match the canonical v3 production alignment.'
          }

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Restore
        run: dotnet restore ThinkControl.slnx

      - name: Build
        run: dotnet build ThinkControl.slnx -c Release --no-restore

      - name: Render release overview
        shell: pwsh
        run: |
          $output = Join-Path $PWD "artifacts\release-previews"
          dotnet run --project tools/ThinkControl.Snapshots/ThinkControl.Snapshots.csproj --configuration Release --no-build -- $output
          if ($LASTEXITCODE -ne 0) { throw "Snapshot renderer failed" }

          $previewNames = @(
            'compact-dark.png',
            'advanced-home.png',
            'advanced-touchpad.png',
            'advanced-sensors.png',
            'advanced-fans.png',
            'advanced-audio.png',
            'advanced-battery.png',
            'hardware-setup-ready.png'
          )
          foreach ($name in $previewNames) {
            $path = Join-Path $output $name
            if (-not (Test-Path $path)) { throw "Missing release preview: $name" }
            if ((Get-Item $path).Length -lt 5000) { throw "Release preview is unexpectedly small: $name" }
          }

          Add-Type -AssemblyName System.Drawing
          $overview = New-Object System.Drawing.Bitmap 1642, 1532
          $graphics = [System.Drawing.Graphics]::FromImage($overview)
          try {
            $graphics.Clear([System.Drawing.Color]::FromArgb(17, 19, 21))
            $graphics.InterpolationMode = [System.Drawing.Drawing2D.InterpolationMode]::HighQualityBicubic
            $graphics.PixelOffsetMode = [System.Drawing.Drawing2D.PixelOffsetMode]::HighQuality

            function Draw-Preview([string]$name, [int]$x, [int]$y, [int]$width, [int]$height) {
              $image = [System.Drawing.Image]::FromFile((Join-Path $output $name))
              try {
                $scale = [math]::Min(([double]$width / $image.Width), ([double]$height / $image.Height))
                $drawWidth = [int][math]::Round($image.Width * $scale)
                $drawHeight = [int][math]::Round($image.Height * $scale)
                $drawX = $x + [int][math]::Floor(($width - $drawWidth) / 2)
                $drawY = $y + [int][math]::Floor(($height - $drawHeight) / 2)
                $graphics.DrawImage($image, $drawX, $drawY, $drawWidth, $drawHeight)
              }
              finally {
                $image.Dispose()
              }
            }

            Draw-Preview 'compact-dark.png' 24 84 410 640
            Draw-Preview 'advanced-home.png' 458 24 1160 760

            $grid = @(
              'advanced-touchpad.png',
              'advanced-sensors.png',
              'advanced-fans.png',
              'advanced-audio.png',
              'advanced-battery.png',
              'hardware-setup-ready.png'
            )
            for ($i = 0; $i -lt $grid.Count; $i++) {
              $column = $i % 3
              $row = [math]::Floor($i / 3)
              $x = 24 + ($column * 540)
              $y = 808 + ($row * 363)
              Draw-Preview $grid[$i] $x $y 514 337
            }

            $overviewPath = Join-Path $output 'ui-overview.png'
            $overview.Save($overviewPath, [System.Drawing.Imaging.ImageFormat]::Png)
          }
          finally {
            $graphics.Dispose()
            $overview.Dispose()
          }

          $overviewFile = Get-Item (Join-Path $output 'ui-overview.png')
          if ($overviewFile.Length -lt 20000) { throw "Release overview is unexpectedly small" }
          Write-Host "Release overview: $([math]::Round($overviewFile.Length / 1KB)) KB"

      - name: Publish UI
        shell: pwsh
        run: |
          dotnet publish src/ThinkControl.UI/ThinkControl.UI.csproj `
            -c Release `
            -r win-x64 `
            --self-contained false `
            -p:Version=$env:APP_VERSION `
            -p:InformationalVersion=$env:APP_VERSION `
            -p:DebugType=None `
            -p:DebugSymbols=false `
            -o artifacts/ui

      - name: Publish hardware service
        shell: pwsh
        run: |
          dotnet publish src/ThinkControl.Service/ThinkControl.Service.csproj `
            -c Release `
            -r win-x64 `
            --self-contained false `
            -p:Version=$env:APP_VERSION `
            -p:InformationalVersion=$env:APP_VERSION `
            -p:DebugType=None `
            -p:DebugSymbols=false `
            -o artifacts/service

      - name: Verify compact managed payloads
        shell: pwsh
        run: |
          $ui = "artifacts/ui/ThinkControl.UI.exe"
          $service = "artifacts/service/ThinkControl.Service.exe"
          if (-not (Test-Path $ui)) { throw "UI executable is missing" }
          if (-not (Test-Path $service)) { throw "Service executable is missing" }
          if ((Get-Item $ui).Length -lt 100000) { throw "UI executable is unexpectedly small" }
          if ((Get-Item $service).Length -lt 100000) { throw "Service executable is unexpectedly small" }

          $uiBytes = (Get-ChildItem artifacts/ui -Recurse -File | Measure-Object Length -Sum).Sum
          $serviceBytes = (Get-ChildItem artifacts/service -Recurse -File | Measure-Object Length -Sum).Sum
          $total = $uiBytes + $serviceBytes
          Write-Host ("UI payload: {0:N2} MB" -f ($uiBytes / 1MB))
          Write-Host ("Service payload: {0:N2} MB" -f ($serviceBytes / 1MB))
          Write-Host ("Combined installed payload: {0:N2} MB" -f ($total / 1MB))
          if ($total -gt 65MB) {
            throw "Framework-dependent installed payload unexpectedly exceeds 65 MB."
          }

      - name: Create release payload archive
        shell: pwsh
        run: |
          $root = "artifacts/payload-root"
          $installerDir = "artifacts/installer"
          New-Item "$root/ui" -ItemType Directory -Force | Out-Null
          New-Item "$root/service" -ItemType Directory -Force | Out-Null
          New-Item $installerDir -ItemType Directory -Force | Out-Null
          Copy-Item "artifacts/ui/*" "$root/ui" -Recurse -Force
          Copy-Item "artifacts/service/*" "$root/service" -Recurse -Force

          $payloadFile = "ThinkControl-Payload-$env:APP_VERSION.zip"
          $payloadPath = Join-Path $installerDir $payloadFile
          Compress-Archive -Path "$root/*" -DestinationPath $payloadPath -CompressionLevel Optimal -Force

          $payload = Get-Item $payloadPath
          $hash = (Get-FileHash $payload.FullName -Algorithm SHA256).Hash.ToLowerInvariant()
          $url = "https://github.com/Hugowhitee/ThinkControl/releases/download/v$env:SOURCE_VERSION/$payloadFile"
          Write-Host "Payload: $payloadFile - $([math]::Round($payload.Length / 1MB, 2)) MB"
          if ($payload.Length -gt 20MB) {
            throw "Compressed ThinkControl payload exceeds the 20 MB budget."
          }

          "PAYLOAD_FILE=$payloadFile" | Out-File $env:GITHUB_ENV -Encoding utf8 -Append
          "PAYLOAD_PATH=$($payload.FullName)" | Out-File $env:GITHUB_ENV -Encoding utf8 -Append
          "PAYLOAD_SHA256=$hash" | Out-File $env:GITHUB_ENV -Encoding utf8 -Append
          "PAYLOAD_URL=$url" | Out-File $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Install Inno Setup
        shell: pwsh
        run: choco install innosetup --no-progress -y

      - name: Build web bootstrap installer
        shell: pwsh
        run: |
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) { throw "Inno Setup compiler not found" }
          & $iscc `
            "/DAppVersion=$env:APP_VERSION" `
            "/DNumericVersion=$env:NUMERIC_VERSION" `
            "/DPayloadFile=$env:PAYLOAD_FILE" `
            "/DPayloadUrl=$env:PAYLOAD_URL" `
            "/DPayloadSha256=$env:PAYLOAD_SHA256" `
            "installer/ThinkControl.iss"
          if ($LASTEXITCODE -ne 0) { throw "Inno Setup failed with exit code $LASTEXITCODE" }

          $setup = Get-ChildItem "artifacts/installer/ThinkControl-Setup-*.exe" | Select-Object -First 1
          if ($null -eq $setup) { throw "Installer was not produced" }
          Write-Host "Bootstrap installer: $($setup.Name) - $([math]::Round($setup.Length / 1MB, 2)) MB"
          if ($setup.Length -gt 5MB) {
            throw "ThinkControl bootstrap installer exceeds the 5 MB hard budget. The application payload must not be embedded."
          }

      - name: Smoke-test bootstrap payload and service lifecycle
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $serviceName = 'ThinkControlService'
          $setup = Get-ChildItem "artifacts/installer/ThinkControl-Setup-*.exe" | Select-Object -First 1
          $payload = Get-Item $env:PAYLOAD_PATH
          if ($null -eq $setup) { throw "Installer missing" }
          if (-not $payload.Exists) { throw "Payload missing" }

          $smokeDir = Join-Path $env:TEMP "ThinkControlInstallerSmoke"

          function Show-ServiceDiagnostics {
            Write-Host "--- sc.exe query $serviceName ---"
            $query = Start-Process -FilePath "$env:SystemRoot\System32\sc.exe" -ArgumentList @('query', $serviceName) -Wait -PassThru -NoNewWindow
            Write-Host "sc query exit code: $($query.ExitCode)"
            Write-Host "--- sc.exe qc $serviceName ---"
            $qc = Start-Process -FilePath "$env:SystemRoot\System32\sc.exe" -ArgumentList @('qc', $serviceName) -Wait -PassThru -NoNewWindow
            Write-Host "sc qc exit code: $($qc.ExitCode)"
            Write-Host "--- recent Service Control Manager events ---"
            try {
              Get-WinEvent -FilterHashtable @{
                LogName='System'
                ProviderName='Service Control Manager'
                StartTime=(Get-Date).AddMinutes(-5)
              } -ErrorAction Stop |
                Where-Object { $_.Message -match 'ThinkControl' } |
                Select-Object -First 12 TimeCreated, Id, LevelDisplayName, Message |
                Format-List | Out-String | Write-Host
            }
            catch {
              Write-Host "No readable ThinkControl Service Control Manager events: $($_.Exception.Message)"
            }
          }

          function Remove-SmokeService {
            Start-Process -FilePath "$env:SystemRoot\System32\sc.exe" -ArgumentList @('stop', $serviceName) -Wait -PassThru -WindowStyle Hidden | Out-Null
            Start-Sleep -Milliseconds 400
            Start-Process -FilePath "$env:SystemRoot\System32\sc.exe" -ArgumentList @('delete', $serviceName) -Wait -PassThru -WindowStyle Hidden | Out-Null

            $deadline = (Get-Date).AddSeconds(20)
            do {
              $remaining = Get-Service -Name $serviceName -ErrorAction SilentlyContinue
              if ($null -eq $remaining) { return }
              Start-Sleep -Milliseconds 500
            } while ((Get-Date) -lt $deadline)
          }

          try {
            Write-Host "[smoke] Cleaning previous test state"
            Remove-SmokeService
            Remove-Item $smokeDir -Recurse -Force -ErrorAction SilentlyContinue

            Write-Host "[smoke] Installing $($setup.Name) using external verified payload $($payload.Name)"
            $payloadArg = "/PAYLOAD=`"$($payload.FullName)`""
            $dirArg = "/DIR=`"$smokeDir`""
            $install = Start-Process -FilePath $setup.FullName -ArgumentList @(
              "/VERYSILENT",
              "/SUPPRESSMSGBOXES",
              "/NORESTART",
              "/SP-",
              $dirArg,
              $payloadArg
            ) -Wait -PassThru
            Write-Host "[smoke] Installer exit code: $($install.ExitCode)"
            if ($install.ExitCode -ne 0) { throw "Silent install failed with exit code $($install.ExitCode)" }

            $ui = Join-Path $smokeDir "ui\ThinkControl.UI.exe"
            $serviceExe = Join-Path $smokeDir "service\ThinkControl.Service.exe"
            $uninstaller = Join-Path $smokeDir "unins000.exe"
            if (-not (Test-Path $ui)) { throw "Installed UI executable not found at $ui" }
            if (-not (Test-Path $serviceExe)) { throw "Installed service executable not found at $serviceExe" }
            if (-not (Test-Path $uninstaller)) { throw "Uninstaller not found at $uninstaller" }

            $service = $null
            $deadline = (Get-Date).AddSeconds(20)
            do {
              $service = Get-Service -Name $serviceName -ErrorAction SilentlyContinue
              if ($null -ne $service) {
                $service.Refresh()
                Write-Host "[smoke] Service status: $($service.Status)"
                if ($service.Status -eq [System.ServiceProcess.ServiceControllerStatus]::Running) { break }
              }
              Start-Sleep -Milliseconds 750
            } while ((Get-Date) -lt $deadline)

            if ($null -eq $service -or $service.Status -ne [System.ServiceProcess.ServiceControllerStatus]::Running) {
              Show-ServiceDiagnostics
              throw "$serviceName did not reach Running state"
            }

            $uninstall = Start-Process -FilePath $uninstaller -ArgumentList @(
              "/VERYSILENT",
              "/SUPPRESSMSGBOXES",
              "/NORESTART"
            ) -Wait -PassThru
            if ($uninstall.ExitCode -ne 0) { throw "Silent uninstall failed with exit code $($uninstall.ExitCode)" }

            $deadline = (Get-Date).AddSeconds(20)
            $serviceAfter = $null
            do {
              $serviceAfter = Get-Service -Name $serviceName -ErrorAction SilentlyContinue
              if ($null -eq $serviceAfter) { break }
              Start-Sleep -Milliseconds 500
            } while ((Get-Date) -lt $deadline)

            if (Test-Path $ui) { throw "UI executable remained after uninstall" }
            if (Test-Path $serviceExe) { throw "Service executable remained after uninstall" }
            if ($null -ne $serviceAfter) {
              Show-ServiceDiagnostics
              throw "$serviceName remained registered after uninstall"
            }

            Write-Host "[smoke] Web bootstrap + payload + service lifecycle passed"
          }
          catch {
            Write-Host "[smoke] FAILURE: $($_.Exception.Message)"
            Show-ServiceDiagnostics
            throw
          }
          finally {
            Remove-SmokeService
            Remove-Item $smokeDir -Recurse -Force -ErrorAction SilentlyContinue
          }

      - name: Create checksums
        shell: pwsh
        run: |
          $setup = Get-ChildItem "artifacts/installer/ThinkControl-Setup-*.exe" | Select-Object -First 1
          $payload = Get-Item $env:PAYLOAD_PATH
          $lines = @()
          foreach ($file in @($setup, $payload)) {
            $hash = (Get-FileHash $file.FullName -Algorithm SHA256).Hash.ToLowerInvariant()
            $lines += "$hash  $($file.Name)"
          }
          $lines | Set-Content "artifacts/installer/SHA256SUMS.txt" -Encoding ascii

      - name: Upload development artifact
        if: env.VERSIONED_RELEASE == '0'
        uses: actions/upload-artifact@v4
        with:
          name: ThinkControl-${{ env.APP_VERSION }}
          path: |
            artifacts/installer/ThinkControl-Setup-*.exe
            artifacts/installer/ThinkControl-Payload-*.zip
            artifacts/installer/SHA256SUMS.txt
          if-no-files-found: error

      - name: Publish tagged GitHub release
        if: env.VERSIONED_RELEASE == '1'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $setup = Get-ChildItem "artifacts/installer/ThinkControl-Setup-*.exe" | Select-Object -First 1
          $payload = Get-Item $env:PAYLOAD_PATH
          $overview = Join-Path "artifacts/release-previews" 'ui-overview.png'
          $args = @(
            'release', 'create', $env:GITHUB_REF_NAME,
            $setup.FullName,
            $payload.FullName,
            'artifacts/installer/SHA256SUMS.txt',
            $overview,
            '--title', "ThinkControl v$env:APP_VERSION",
            '--generate-notes'
          )
          if ($env:APP_VERSION -match '-') {
            $args += '--prerelease'
          }
          & gh @args
          if ($LASTEXITCODE -ne 0) { throw "GitHub release creation failed" }
