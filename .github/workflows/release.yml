name: Package ThinkControl

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "src/**"
      - "installer/**"
      - "tools/release/**"
      - "assets/brand/**"
      - "README.md"
      - "version.json"
      - ".github/workflows/release.yml"
  push:
    tags:
      - "v*"

permissions:
  contents: write

concurrency:
  group: package-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  package:
    runs-on: windows-latest
    timeout-minutes: 18

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Resolve version
        shell: pwsh
        run: |
          $metadata = Get-Content "version.json" -Raw | ConvertFrom-Json
          $sourceVersion = [string]$metadata.version
          if ([string]::IsNullOrWhiteSpace($sourceVersion)) {
            throw "version.json does not contain a version"
          }

          if ($env:GITHUB_REF -like 'refs/tags/v*') {
            $version = $env:GITHUB_REF_NAME.TrimStart('v')
            if ($version -ne $sourceVersion) {
              throw "Release tag '$env:GITHUB_REF_NAME' does not match version.json ('v$sourceVersion'). Update version.json first."
            }
            "VERSIONED_RELEASE=1" | Out-File $env:GITHUB_ENV -Encoding utf8 -Append
          }
          else {
            $version = "$sourceVersion-dev.$env:GITHUB_RUN_NUMBER"
            "VERSIONED_RELEASE=0" | Out-File $env:GITHUB_ENV -Encoding utf8 -Append
          }

          $coreVersion = $sourceVersion.Split('-')[0]
          $build = [int]$env:GITHUB_RUN_NUMBER % 65535
          $numericVersion = "$coreVersion.$build"
          "SOURCE_VERSION=$sourceVersion" | Out-File $env:GITHUB_ENV -Encoding utf8 -Append
          "APP_VERSION=$version" | Out-File $env:GITHUB_ENV -Encoding utf8 -Append
          "NUMERIC_VERSION=$numericVersion" | Out-File $env:GITHUB_ENV -Encoding utf8 -Append
          Write-Host "ThinkControl version: $version"

      - name: Verify canonical v3 branding
        shell: pwsh
        run: ./tools/release/Verify-Branding.ps1

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: "10.0.x"

      - name: Restore tagged release preview renderer
        if: env.VERSIONED_RELEASE == '1'
        shell: pwsh
        run: dotnet restore tools/ThinkControl.Snapshots/ThinkControl.Snapshots.csproj

      - name: Build tagged release preview renderer
        if: env.VERSIONED_RELEASE == '1'
        shell: pwsh
        run: dotnet build tools/ThinkControl.Snapshots/ThinkControl.Snapshots.csproj -c Release --no-restore

      - name: Render tagged release overview
        if: env.VERSIONED_RELEASE == '1'
        shell: pwsh
        run: ./tools/release/Render-ReleaseOverview.ps1

      - name: Build release payload
        shell: pwsh
        run: ./tools/release/Build-ReleasePayload.ps1

      - name: Ensure Inno Setup
        shell: pwsh
        run: |
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (Test-Path $iscc) {
            Write-Host "Using preinstalled Inno Setup: $iscc"
            exit 0
          }

          Write-Host "Inno Setup not present on runner; installing fallback package."
          choco install innosetup --no-progress -y
          if (-not (Test-Path $iscc)) { throw "Inno Setup compiler not found after fallback install" }

      - name: Build web bootstrap installer
        shell: pwsh
        run: ./tools/release/Build-BootstrapInstaller.ps1

      - name: Deep installer and IPC reliability smoke
        shell: pwsh
        run: ./tools/release/InstallerReliabilitySmoke.ps1 -ArtifactDirectory ./artifacts/installer

      - name: Restore oldest-supported updater fixture cache
        id: legacy-cache
        uses: actions/cache@v6
        with:
          path: artifacts/legacy-alpha14
          key: thinkcontrol-updater-fixture-v0.1.0-alpha.14.1

      - name: Download oldest-supported updater fixture (alpha.14.1)
        if: steps.legacy-cache.outputs.cache-hit != 'true'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $legacy = "artifacts/legacy-alpha14"
          New-Item $legacy -ItemType Directory -Force | Out-Null
          gh release download v0.1.0-alpha.14.1 `
            --repo $env:GITHUB_REPOSITORY `
            --pattern "ThinkControl-Setup-0.1.0-alpha.14.1.exe" `
            --pattern "ThinkControl-Payload-0.1.0-alpha.14.1.zip" `
            --dir $legacy

      - name: Verify oldest-supported updater fixture
        shell: pwsh
        run: |
          $legacy = "artifacts/legacy-alpha14"
          if (-not (Test-Path $legacy)) { throw "alpha.14.1 regression fixture directory is missing" }
          if ((Get-ChildItem $legacy -File).Count -ne 2) { throw "alpha.14.1 regression fixture is incomplete" }

      - name: Oldest-supported upgrade compatibility
        shell: pwsh
        run: |
          ./tools/release/Alpha14UpgradeCompatibilitySmoke.ps1 `
            -CandidateArtifactDirectory ./artifacts/installer `
            -LegacyArtifactDirectory ./artifacts/legacy-alpha14 `
            -ExpectedVersion $env:APP_VERSION

      - name: Create checksums
        shell: pwsh
        run: ./tools/release/Write-ReleaseChecksums.ps1

      - name: Upload development artifact
        if: env.VERSIONED_RELEASE == '0'
        uses: actions/upload-artifact@v7
        with:
          name: ThinkControl-${{ env.APP_VERSION }}
          path: |
            artifacts/installer/ThinkControl-Setup-*.exe
            artifacts/installer/ThinkControl-Payload-*.zip
            artifacts/installer/SHA256SUMS.txt
          if-no-files-found: error
          compression-level: 0
          retention-days: 7

      - name: Publish tagged GitHub release
        if: env.VERSIONED_RELEASE == '1'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $setup = Get-ChildItem "artifacts/installer/ThinkControl-Setup-*.exe" | Select-Object -First 1
          $payload = Get-Item $env:PAYLOAD_PATH
          $overview = Get-Item "artifacts/release-previews/ui-overview.png"
          $overviewUrl = "https://github.com/$env:GITHUB_REPOSITORY/releases/download/$env:GITHUB_REF_NAME/ui-overview.png"
          $galleryNotes = "## Interface preview`n`n[![ThinkControl interface overview]($overviewUrl)]($overviewUrl)"
          $args = @(
            'release', 'create', $env:GITHUB_REF_NAME,
            $setup.FullName,
            $payload.FullName,
            'artifacts/installer/SHA256SUMS.txt',
            $overview.FullName,
            '--title', "ThinkControl v$env:APP_VERSION",
            '--notes', $galleryNotes,
            '--generate-notes'
          )
          if ($env:APP_VERSION -match '-') {
            $args += '--prerelease'
          }
          & gh @args
          if ($LASTEXITCODE -ne 0) { throw "GitHub release creation failed" }
