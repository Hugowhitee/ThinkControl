name: Validate final alpha.11 once

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/validate-alpha11-once.yml"

permissions:
  contents: read
  actions: write
  pull-requests: write
  issues: write

concurrency:
  group: validate-final-alpha11
  cancel-in-progress: true

jobs:
  validate:
    runs-on: windows-latest
    timeout-minutes: 50
    env:
      PR_NUMBER: "35"
      REVIEW_BRANCH: "fix/alpha11-final-review"
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Capture current PR head
        shell: pwsh
        run: |
          $json = gh pr view $env:PR_NUMBER --repo $env:GITHUB_REPOSITORY --json headRefOid,state
          if ($LASTEXITCODE -ne 0) { throw "Could not read PR #$env:PR_NUMBER" }
          $pr = $json | ConvertFrom-Json
          if ($pr.state -ne 'OPEN') { throw "PR #$env:PR_NUMBER is not open" }
          $head = [string]$pr.headRefOid
          "REVIEW_HEAD=$head" | Out-File $env:GITHUB_ENV -Encoding utf8 -Append
          Write-Host "Validating PR head $head"
          gh pr comment $env:PR_NUMBER --repo $env:GITHUB_REPOSITORY --body "🔎 Final alpha.11 validator started for exact head $head. This run only validates; it will not merge or publish anything."

      - name: Checkout exact review head
        uses: actions/checkout@v4
        with:
          ref: ${{ env.REVIEW_HEAD }}
          fetch-depth: 0

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Restore
        run: dotnet restore ThinkControl.slnx

      - name: Build
        run: dotnet build ThinkControl.slnx --configuration Release --no-restore

      - name: Test
        run: dotnet test tests/ThinkControl.Core.Tests/ThinkControl.Core.Tests.csproj --configuration Release --no-build --no-restore

      - name: Render and validate WPF snapshots
        shell: pwsh
        run: |
          $output = Join-Path $PWD "artifacts\snapshots"
          dotnet run --project tools/ThinkControl.Snapshots/ThinkControl.Snapshots.csproj --configuration Release --no-build -- $output
          if ($LASTEXITCODE -ne 0) { throw "Snapshot renderer failed" }
          $expected = @(
            'compact-dark.png','compact-on-battery.png','compact-light.png',
            'advanced-system-service-offline.png','advanced-keyboard-unavailable.png','advanced-fans-unavailable.png',
            'advanced-home-light.png','advanced-touchpad-light.png','advanced-sensors-light.png',
            'notifications-hardware-attention.png','notifications-hardware-attention-light.png',
            'hardware-setup-pawnio-repair.png','hardware-setup-pawnio-repair-min.png','hardware-setup-ready.png',
            'telemetry-detail-battery.png'
          )
          foreach ($page in @('home','performance','fans','sensors','display','audio','keyboard','battery','touchpad','system','updates','settings')) {
            $expected += "advanced-$page.png"
            $expected += "advanced-$page-min.png"
            $expected += "advanced-$page-wide.png"
          }
          foreach ($name in $expected) {
            $path = Join-Path $output $name
            if (-not (Test-Path $path)) { throw "Missing UI snapshot: $name" }
            if ((Get-Item $path).Length -lt 5000) { throw "UI snapshot is unexpectedly small: $name" }
          }

      - name: Run complete installer/package gate
        shell: pwsh
        run: |
          $started = (Get-Date).ToUniversalTime()
          gh workflow run release.yml --repo $env:GITHUB_REPOSITORY --ref $env:REVIEW_BRANCH
          if ($LASTEXITCODE -ne 0) { throw "Could not dispatch Package ThinkControl" }

          $runId = $null
          $deadline = (Get-Date).AddMinutes(4)
          do {
            Start-Sleep -Seconds 4
            $json = gh run list --repo $env:GITHUB_REPOSITORY --workflow release.yml --branch $env:REVIEW_BRANCH --event workflow_dispatch --limit 20 --json databaseId,headSha,status,conclusion,createdAt
            if ($LASTEXITCODE -ne 0) { throw "Could not query Package ThinkControl runs" }
            $runs = $json | ConvertFrom-Json
            $candidate = $runs | Where-Object {
              $_.headSha -eq $env:REVIEW_HEAD -and ([DateTimeOffset]$_.createdAt).UtcDateTime -ge $started.AddMinutes(-1)
            } | Sort-Object { [DateTimeOffset]$_.createdAt } -Descending | Select-Object -First 1
            if ($null -ne $candidate) { $runId = [string]$candidate.databaseId }
          } while (-not $runId -and (Get-Date) -lt $deadline)

          if (-not $runId) { throw "Could not find Package ThinkControl run for $env:REVIEW_HEAD" }
          Write-Host "Watching Package ThinkControl run $runId"
          gh run watch $runId --repo $env:GITHUB_REPOSITORY --exit-status
          if ($LASTEXITCODE -ne 0) { throw "Package ThinkControl failed for $env:REVIEW_HEAD" }
          "PACKAGE_RUN=$runId" | Out-File $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Verify PR did not move
        shell: pwsh
        run: |
          $json = gh pr view $env:PR_NUMBER --repo $env:GITHUB_REPOSITORY --json headRefOid,state
          $pr = $json | ConvertFrom-Json
          if ($pr.state -ne 'OPEN') { throw "PR is no longer open" }
          if ([string]$pr.headRefOid -ne $env:REVIEW_HEAD) {
            throw "PR head changed during validation; tested $env:REVIEW_HEAD but current is $($pr.headRefOid)"
          }

      - name: Report validated head
        shell: pwsh
        run: |
          gh pr comment $env:PR_NUMBER --repo $env:GITHUB_REPOSITORY --body "✅ Final alpha.11 validation passed for exact head $env:REVIEW_HEAD: Release build, unit tests, WPF visual QA, Package ThinkControl, installer/payload creation and install→service→uninstall smoke lifecycle all passed. Package run: $env:PACKAGE_RUN."

      - name: Report validation failure
        if: failure()
        shell: pwsh
        run: |
          gh pr comment $env:PR_NUMBER --repo $env:GITHUB_REPOSITORY --body "❌ Final alpha.11 validation failed or the PR head changed while it was running. Nothing was merged or published by this validator. Open the latest ‘Validate final alpha.11 once’ run to see the exact failing step."
