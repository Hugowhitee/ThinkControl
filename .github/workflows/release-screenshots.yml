name: Publish release screenshots

on:
  push:
    tags:
      - "v*"
  workflow_run:
    workflows: ["Package ThinkControl"]
    types: [completed]

permissions:
  contents: write

jobs:
  screenshots:
    if: >-
      github.event_name == 'push' ||
      (github.event_name == 'workflow_run' &&
       github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.event == 'workflow_dispatch')
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - name: Checkout released commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || github.sha }}

      - name: Resolve release tag
        shell: pwsh
        run: |
          $metadata = Get-Content version.json -Raw | ConvertFrom-Json
          $version = [string]$metadata.version
          if ([string]::IsNullOrWhiteSpace($version)) { throw "version.json does not contain a version" }
          "RELEASE_TAG=v$version" | Out-File $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Restore and build
        shell: pwsh
        run: |
          dotnet restore ThinkControl.slnx
          if ($LASTEXITCODE -ne 0) { throw "Restore failed" }
          dotnet build ThinkControl.slnx --configuration Release --no-restore
          if ($LASTEXITCODE -ne 0) { throw "Build failed" }

      - name: Render release screenshots
        shell: pwsh
        run: |
          $output = Join-Path $PWD "artifacts\release-screenshots"
          dotnet run --project tools/ThinkControl.Snapshots/ThinkControl.Snapshots.csproj `
            --configuration Release `
            --no-build `
            -- $output
          if ($LASTEXITCODE -ne 0) { throw "Snapshot renderer failed" }

          foreach ($name in @('compact-dark.png', 'advanced-touchpad.png', 'advanced-fans.png')) {
            $path = Join-Path $output $name
            if (-not (Test-Path $path)) { throw "Missing release screenshot: $name" }
            if ((Get-Item $path).Length -lt 5000) { throw "Release screenshot is unexpectedly small: $name" }
          }

      - name: Upload screenshots to tagged release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $deadline = (Get-Date).AddMinutes(5)
          do {
            gh release view $env:RELEASE_TAG --repo $env:GITHUB_REPOSITORY *> $null
            if ($LASTEXITCODE -eq 0) { break }
            Start-Sleep -Seconds 10
          } while ((Get-Date) -lt $deadline)

          gh release view $env:RELEASE_TAG --repo $env:GITHUB_REPOSITORY *> $null
          if ($LASTEXITCODE -ne 0) { throw "Tagged release $env:RELEASE_TAG did not become available in time" }

          gh release upload $env:RELEASE_TAG `
            "artifacts/release-screenshots/compact-dark.png" `
            "artifacts/release-screenshots/advanced-touchpad.png" `
            "artifacts/release-screenshots/advanced-fans.png" `
            --repo $env:GITHUB_REPOSITORY `
            --clobber
          if ($LASTEXITCODE -ne 0) { throw "Release screenshot upload failed" }
