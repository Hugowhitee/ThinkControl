name: Publish validated release

on:
  workflow_run:
    workflows: ["CI"]
    branches: [main]
    types: [completed]

permissions:
  contents: write
  actions: write

concurrency:
  group: thinkcontrol-release
  cancel-in-progress: false

jobs:
  trigger-release:
    if: github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout validated main commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          fetch-depth: 0

      - name: Resolve release metadata
        id: release
        shell: pwsh
        run: |
          $metadata = Get-Content version.json -Raw | ConvertFrom-Json
          $version = [string]$metadata.version
          if ([string]::IsNullOrWhiteSpace($version)) {
            throw 'version.json does not contain a version'
          }
          if ($metadata.releaseReady -ne $true) {
            "ready=0" | Out-File $env:GITHUB_OUTPUT -Encoding utf8 -Append
            Write-Host "Version $version is not marked releaseReady."
            exit 0
          }
          "ready=1" | Out-File $env:GITHUB_OUTPUT -Encoding utf8 -Append
          "version=$version" | Out-File $env:GITHUB_OUTPUT -Encoding utf8 -Append
          "tag=v$version" | Out-File $env:GITHUB_OUTPUT -Encoding utf8 -Append
          "prerelease=$([int]$version.Contains('-'))" | Out-File $env:GITHUB_OUTPUT -Encoding utf8 -Append

      - name: Publish or repair tagged packaging
        if: steps.release.outputs.ready == '1'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.release.outputs.tag }}
          RELEASE_SHA: ${{ github.event.workflow_run.head_sha }}
          IS_PRERELEASE: ${{ steps.release.outputs.prerelease }}
        run: |
          set -euo pipefail

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch --tags --force origin

          release_exists=0
          if gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            release_exists=1
          fi

          tag_exists=0
          tag_commit=""
          if git rev-parse -q --verify "refs/tags/$RELEASE_TAG" >/dev/null 2>&1; then
            tag_exists=1
            tag_commit="$(git rev-list -n 1 "$RELEASE_TAG")"
          fi

          if [ "$release_exists" -eq 1 ] && [ "$tag_commit" = "$RELEASE_SHA" ]; then
            echo "$RELEASE_TAG is already published from the validated main commit; nothing to do."
            exit 0
          fi

          # A stale prerelease can be repaired safely. Stable releases remain immutable:
          # if a stable tag/release disagrees with validated main, stop instead of rewriting it.
          if [ "$release_exists" -eq 1 ] && [ "$tag_commit" != "$RELEASE_SHA" ]; then
            if [ "$IS_PRERELEASE" != "1" ]; then
              echo "Stable release $RELEASE_TAG points at $tag_commit, expected $RELEASE_SHA; refusing to rewrite it." >&2
              exit 1
            fi
            echo "Removing stale prerelease $RELEASE_TAG at $tag_commit so it can be rebuilt from $RELEASE_SHA."
            gh release delete "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --cleanup-tag --yes
            git fetch --tags --force --prune origin
            tag_exists=0
            tag_commit=""
          elif [ "$tag_exists" -eq 1 ] && [ "$tag_commit" != "$RELEASE_SHA" ]; then
            if [ "$IS_PRERELEASE" != "1" ]; then
              echo "Stable tag $RELEASE_TAG points at $tag_commit, expected $RELEASE_SHA; refusing to rewrite it." >&2
              exit 1
            fi
            echo "Moving stale prerelease tag $RELEASE_TAG from $tag_commit to $RELEASE_SHA."
            git tag -fa "$RELEASE_TAG" "$RELEASE_SHA" -m "ThinkControl $RELEASE_TAG"
            git push --force origin "refs/tags/$RELEASE_TAG"
            tag_exists=1
            tag_commit="$RELEASE_SHA"
          fi

          if [ "$tag_exists" -eq 0 ]; then
            git tag -a "$RELEASE_TAG" "$RELEASE_SHA" -m "ThinkControl $RELEASE_TAG"
            git push origin "refs/tags/$RELEASE_TAG"
            echo "Pushed $RELEASE_TAG at $RELEASE_SHA."
          fi

          # Events created with GITHUB_TOKEN do not normally trigger another workflow.
          # Explicitly dispatch the packaging workflow at the validated tag.
          gh workflow run release.yml --repo "$GITHUB_REPOSITORY" --ref "$RELEASE_TAG"
          echo "Dispatched Package ThinkControl for $RELEASE_TAG at $RELEASE_SHA."
