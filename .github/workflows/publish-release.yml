name: Publish validated release

on:
  workflow_run:
    workflows: ["CI"]
    branches: [main]
    types: [completed]

permissions:
  contents: write
  actions: write

concurrency:
  group: thinkcontrol-release
  cancel-in-progress: false

jobs:
  trigger-release:
    if: github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout validated main commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          fetch-depth: 0

      - name: Resolve release metadata
        id: release
        shell: pwsh
        run: |
          $metadata = Get-Content version.json -Raw | ConvertFrom-Json
          $version = [string]$metadata.version
          if ([string]::IsNullOrWhiteSpace($version)) {
            throw 'version.json does not contain a version'
          }
          if ($metadata.releaseReady -ne $true) {
            "ready=0" | Out-File $env:GITHUB_OUTPUT -Encoding utf8 -Append
            Write-Host "Version $version is not marked releaseReady."
            exit 0
          }
          "ready=1" | Out-File $env:GITHUB_OUTPUT -Encoding utf8 -Append
          "version=$version" | Out-File $env:GITHUB_OUTPUT -Encoding utf8 -Append
          "tag=v$version" | Out-File $env:GITHUB_OUTPUT -Encoding utf8 -Append

      - name: Publish or resume tagged packaging
        if: steps.release.outputs.ready == '1'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.release.outputs.tag }}
          RELEASE_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          set -euo pipefail

          if gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "$RELEASE_TAG is already published; nothing to do."
            exit 0
          fi

          if ! git ls-remote --exit-code --tags origin "refs/tags/$RELEASE_TAG" >/dev/null 2>&1; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git tag -a "$RELEASE_TAG" "$RELEASE_SHA" -m "ThinkControl $RELEASE_TAG"
            git push origin "$RELEASE_TAG"
            echo "Pushed $RELEASE_TAG."
          else
            echo "Tag $RELEASE_TAG already exists without a public release."
          fi

          # Events created with GITHUB_TOKEN do not normally trigger another
          # workflow automatically. Explicitly dispatch the already validated
          # packaging workflow at the release tag so installer publication cannot
          # stall after the tag is created.
          gh workflow run release.yml --repo "$GITHUB_REPOSITORY" --ref "$RELEASE_TAG"
          echo "Dispatched Package ThinkControl for $RELEASE_TAG."
