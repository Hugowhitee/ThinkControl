name: Installer reliability

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "installer/**"
      - "tools/release/**"
      - "src/ThinkControl.UI/Services/UpdateService.cs"
      - "src/ThinkControl.UI/app.manifest"
      - "src/ThinkControl.UI/ThinkControl.UI.csproj"
      - "src/ThinkControl.Service/**"
      - "version.json"
      - ".github/workflows/installer-reliability.yml"

permissions:
  contents: read

concurrency:
  group: installer-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  build-candidate:
    runs-on: windows-latest
    timeout-minutes: 12
    outputs:
      app_version: ${{ steps.version.outputs.app_version }}

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: "10.0.x"

      - name: Restore NuGet package cache
        uses: actions/cache@v6
        with:
          path: ~/.nuget/packages
          key: ${{ runner.os }}-nuget-runtime-${{ hashFiles('src/**/*.csproj', 'Directory.Build.props') }}
          restore-keys: |
            ${{ runner.os }}-nuget-runtime-

      - name: Resolve smoke version
        id: version
        shell: pwsh
        run: |
          $metadata = Get-Content version.json -Raw | ConvertFrom-Json
          $sourceVersion = [string]$metadata.version
          if ([string]::IsNullOrWhiteSpace($sourceVersion)) { throw "version.json does not contain a version" }
          $coreVersion = $sourceVersion.Split('-')[0]
          $build = [int]$env:GITHUB_RUN_NUMBER % 65535
          $appVersion = "$sourceVersion-smoke.$env:GITHUB_RUN_NUMBER"
          "SOURCE_VERSION=$sourceVersion" | Out-File $env:GITHUB_ENV -Encoding utf8 -Append
          "APP_VERSION=$appVersion" | Out-File $env:GITHUB_ENV -Encoding utf8 -Append
          "NUMERIC_VERSION=$coreVersion.$build" | Out-File $env:GITHUB_ENV -Encoding utf8 -Append
          "app_version=$appVersion" | Out-File $env:GITHUB_OUTPUT -Encoding utf8 -Append

      - name: Restore runtime publish projects
        shell: pwsh
        run: |
          dotnet restore src/ThinkControl.UI/ThinkControl.UI.csproj -r win-x64
          dotnet restore src/ThinkControl.Service/ThinkControl.Service.csproj -r win-x64

      - name: Publish smoke payload
        shell: pwsh
        run: |
          dotnet publish src/ThinkControl.UI/ThinkControl.UI.csproj `
            -c Release -r win-x64 --self-contained false --no-restore `
            -p:Version=$env:APP_VERSION -p:InformationalVersion=$env:APP_VERSION `
            -p:DebugType=None -p:DebugSymbols=false -o artifacts/ui
          dotnet publish src/ThinkControl.Service/ThinkControl.Service.csproj `
            -c Release -r win-x64 --self-contained false --no-restore `
            -p:Version=$env:APP_VERSION -p:InformationalVersion=$env:APP_VERSION `
            -p:DebugType=None -p:DebugSymbols=false -o artifacts/service

          $root = "artifacts/payload-root"
          $installerDir = "artifacts/installer"
          New-Item "$root/ui" -ItemType Directory -Force | Out-Null
          New-Item "$root/service" -ItemType Directory -Force | Out-Null
          New-Item $installerDir -ItemType Directory -Force | Out-Null
          Copy-Item "artifacts/ui/*" "$root/ui" -Recurse -Force
          Copy-Item "artifacts/service/*" "$root/service" -Recurse -Force

          $payloadFile = "ThinkControl-Payload-$env:APP_VERSION.zip"
          $payloadPath = Join-Path $installerDir $payloadFile
          Compress-Archive -Path "$root/*" -DestinationPath $payloadPath -CompressionLevel Optimal -Force
          $payload = Get-Item $payloadPath
          if ($payload.Length -gt 20MB) { throw "Smoke payload exceeds 20 MB budget." }
          $hash = (Get-FileHash $payload.FullName -Algorithm SHA256).Hash.ToLowerInvariant()
          "PAYLOAD_FILE=$payloadFile" | Out-File $env:GITHUB_ENV -Encoding utf8 -Append
          "PAYLOAD_PATH=$($payload.FullName)" | Out-File $env:GITHUB_ENV -Encoding utf8 -Append
          "PAYLOAD_SHA256=$hash" | Out-File $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Verify UI never requests elevation
        shell: pwsh
        run: |
          $manifest = Get-Content src/ThinkControl.UI/app.manifest -Raw
          if ($manifest -notmatch 'requestedExecutionLevel\s+level="asInvoker"\s+uiAccess="false"') {
            throw "ThinkControl.UI must remain asInvoker/uiAccess=false; privileged hardware work belongs in the service."
          }
          $project = Get-Content src/ThinkControl.UI/ThinkControl.UI.csproj -Raw
          if ($project -notmatch '<ApplicationManifest>app\.manifest</ApplicationManifest>') {
            throw "ThinkControl.UI.csproj is not embedding the non-elevating application manifest."
          }

      - name: Ensure Inno Setup
        shell: pwsh
        run: |
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (Test-Path $iscc) {
            Write-Host "Using preinstalled Inno Setup: $iscc"
            exit 0
          }

          Write-Host "Inno Setup not present on runner; installing fallback package."
          choco install innosetup --no-progress -y
          if (-not (Test-Path $iscc)) { throw "Inno Setup compiler not found after fallback install" }

      - name: Build bootstrap installer
        shell: pwsh
        run: |
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) { throw "Inno Setup compiler not found" }
          & $iscc `
            "/DAppVersion=$env:APP_VERSION" `
            "/DNumericVersion=$env:NUMERIC_VERSION" `
            "/DPayloadFile=$env:PAYLOAD_FILE" `
            "/DPayloadUrl=https://invalid.example/$env:PAYLOAD_FILE" `
            "/DPayloadSha256=$env:PAYLOAD_SHA256" `
            "installer/ThinkControl.iss"
          if ($LASTEXITCODE -ne 0) { throw "Inno Setup failed with exit code $LASTEXITCODE" }
          $setup = Get-ChildItem "artifacts/installer/ThinkControl-Setup-*.exe" | Select-Object -First 1
          if ($null -eq $setup) { throw "Installer was not produced" }
          if ($setup.Length -gt 5MB) { throw "Bootstrap installer exceeds 5 MB budget." }

      - name: Upload smoke candidate
        uses: actions/upload-artifact@v7
        with:
          name: ThinkControl-Installer-Smoke-Candidate
          path: artifacts/installer/**
          if-no-files-found: error
          compression-level: 0
          retention-days: 1

  lifecycle-smoke:
    needs: build-candidate
    runs-on: windows-latest
    timeout-minutes: 8

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Download smoke candidate
        uses: actions/download-artifact@v8
        with:
          name: ThinkControl-Installer-Smoke-Candidate
          path: artifacts/installer

      - name: Deep installer and IPC smoke
        shell: pwsh
        run: ./tools/release/InstallerReliabilitySmoke.ps1 -ArtifactDirectory ./artifacts/installer

  oldest-upgrade-smoke:
    needs: build-candidate
    runs-on: windows-latest
    timeout-minutes: 8

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Download smoke candidate
        uses: actions/download-artifact@v8
        with:
          name: ThinkControl-Installer-Smoke-Candidate
          path: artifacts/installer

      - name: Restore oldest-supported updater fixture cache
        id: legacy-cache
        uses: actions/cache@v6
        with:
          path: artifacts/legacy-alpha14
          key: thinkcontrol-updater-fixture-v0.1.0-alpha.14.1

      - name: Download oldest-supported updater fixture (alpha.14.1)
        if: steps.legacy-cache.outputs.cache-hit != 'true'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $legacy = "artifacts/legacy-alpha14"
          New-Item $legacy -ItemType Directory -Force | Out-Null
          gh release download v0.1.0-alpha.14.1 `
            --repo $env:GITHUB_REPOSITORY `
            --pattern "ThinkControl-Setup-0.1.0-alpha.14.1.exe" `
            --pattern "ThinkControl-Payload-0.1.0-alpha.14.1.zip" `
            --dir $legacy

      - name: Verify oldest-supported updater fixture
        shell: pwsh
        run: |
          $legacy = "artifacts/legacy-alpha14"
          if (-not (Test-Path $legacy)) { throw "alpha.14.1 regression fixture directory is missing" }
          if ((Get-ChildItem $legacy -File).Count -ne 2) { throw "alpha.14.1 regression fixture is incomplete" }

      - name: Oldest-supported upgrade compatibility
        shell: pwsh
        run: |
          ./tools/release/Alpha14UpgradeCompatibilitySmoke.ps1 `
            -CandidateArtifactDirectory ./artifacts/installer `
            -LegacyArtifactDirectory ./artifacts/legacy-alpha14 `
            -ExpectedVersion "${{ needs.build-candidate.outputs.app_version }}"
