name: Gate and publish alpha.11 once

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/publish-alpha11-once.yml"

permissions:
  contents: write
  actions: write
  pull-requests: write
  issues: write

jobs:
  gate-and-release:
    runs-on: windows-latest
    timeout-minutes: 55
    env:
      PR_NUMBER: "35"
      REVIEW_BRANCH: "fix/alpha11-final-review"
      RELEASE_TAG: "v0.1.0-alpha.11"
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Announce final gate
        shell: pwsh
        run: |
          gh pr comment $env:PR_NUMBER --repo $env:GITHUB_REPOSITORY --body "Final alpha.11 release gate started: clean build/tests, WPF visual QA and the full Package ThinkControl installer lifecycle will run against the current review head. Merge/tag/release only happen if every gate passes."

      - name: Checkout reviewed branch
        uses: actions/checkout@v4
        with:
          ref: fix/alpha11-final-review
          fetch-depth: 0

      - name: Capture immutable review head
        shell: pwsh
        run: |
          $head = (git rev-parse HEAD).Trim()
          "REVIEW_HEAD=$head" | Out-File $env:GITHUB_ENV -Encoding utf8 -Append
          Write-Host "Review head: $head"

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Restore
        run: dotnet restore ThinkControl.slnx

      - name: Build
        run: dotnet build ThinkControl.slnx --configuration Release --no-restore

      - name: Test
        run: dotnet test tests/ThinkControl.Core.Tests/ThinkControl.Core.Tests.csproj --configuration Release --no-build --no-restore

      - name: Render and validate WPF visual QA
        shell: pwsh
        run: |
          $output = Join-Path $PWD "artifacts\snapshots"
          dotnet run --project tools/ThinkControl.Snapshots/ThinkControl.Snapshots.csproj `
            --configuration Release `
            --no-build `
            -- $output
          if ($LASTEXITCODE -ne 0) { throw "Snapshot renderer failed" }

          $advancedPages = @(
            'home', 'performance', 'fans', 'sensors', 'display', 'audio',
            'keyboard', 'battery', 'touchpad', 'system', 'updates', 'settings'
          )
          $expectedPng = @(
            'compact-dark.png',
            'compact-on-battery.png',
            'compact-light.png',
            'advanced-system-service-offline.png',
            'advanced-keyboard-unavailable.png',
            'advanced-fans-unavailable.png',
            'advanced-home-light.png',
            'advanced-touchpad-light.png',
            'advanced-sensors-light.png',
            'notifications-hardware-attention.png',
            'notifications-hardware-attention-light.png',
            'hardware-setup-pawnio-repair.png',
            'hardware-setup-pawnio-repair-min.png',
            'hardware-setup-ready.png',
            'telemetry-detail-battery.png'
          )
          foreach ($page in $advancedPages) {
            $expectedPng += "advanced-$page.png"
            $expectedPng += "advanced-$page-min.png"
            $expectedPng += "advanced-$page-wide.png"
          }
          foreach ($name in $expectedPng) {
            $path = Join-Path $output $name
            if (-not (Test-Path $path)) { throw "Missing UI snapshot: $name" }
            if ((Get-Item $path).Length -lt 5000) { throw "UI snapshot is unexpectedly small: $name" }
          }
          foreach ($name in @('gallery.html', 'manifest.json', 'README.md')) {
            $path = Join-Path $output $name
            if (-not (Test-Path $path)) { throw "Missing visual QA file: $name" }
            if ((Get-Item $path).Length -lt 500) { throw "Visual QA file is unexpectedly small: $name" }
          }

      - name: Run full Package ThinkControl gate on review head
        shell: pwsh
        run: |
          $started = (Get-Date).ToUniversalTime()
          gh workflow run release.yml --repo $env:GITHUB_REPOSITORY --ref $env:REVIEW_BRANCH
          if ($LASTEXITCODE -ne 0) { throw "Could not dispatch Package ThinkControl" }

          $runId = $null
          $deadline = (Get-Date).AddMinutes(4)
          do {
            Start-Sleep -Seconds 4
            $json = gh run list --repo $env:GITHUB_REPOSITORY --workflow release.yml --branch $env:REVIEW_BRANCH --event workflow_dispatch --limit 20 --json databaseId,headSha,status,conclusion,createdAt
            if ($LASTEXITCODE -ne 0) { throw "Could not query Package ThinkControl runs" }
            $runs = $json | ConvertFrom-Json
            $candidate = $runs | Where-Object {
              $_.headSha -eq $env:REVIEW_HEAD -and ([DateTimeOffset]$_.createdAt).UtcDateTime -ge $started.AddMinutes(-1)
            } | Sort-Object { [DateTimeOffset]$_.createdAt } -Descending | Select-Object -First 1
            if ($null -ne $candidate) { $runId = [string]$candidate.databaseId }
          } while (-not $runId -and (Get-Date) -lt $deadline)

          if (-not $runId) { throw "Package ThinkControl run for review head was not found" }
          Write-Host "Package gate run: $runId"
          gh run watch $runId --repo $env:GITHUB_REPOSITORY --exit-status
          if ($LASTEXITCODE -ne 0) { throw "Package ThinkControl gate failed" }
          "PACKAGE_GATE_RUN=$runId" | Out-File $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Ensure PR head did not move
        shell: pwsh
        run: |
          $json = gh pr view $env:PR_NUMBER --repo $env:GITHUB_REPOSITORY --json headRefOid,state,mergeable
          if ($LASTEXITCODE -ne 0) { throw "Could not read PR state" }
          $pr = $json | ConvertFrom-Json
          if ($pr.state -ne 'OPEN') { throw "PR #$env:PR_NUMBER is no longer open" }
          if ($pr.headRefOid -ne $env:REVIEW_HEAD) {
            throw "PR head moved from tested $env:REVIEW_HEAD to $($pr.headRefOid); refusing to merge untested code"
          }
          if ($pr.mergeable -eq 'CONFLICTING') { throw "PR has merge conflicts" }

      - name: Squash merge tested alpha.11 review
        shell: pwsh
        run: |
          $body = @{
            commit_title = 'Finish alpha.11 release review (#35)'
            commit_message = 'Finalize alpha.11 hardware/readback gating, battery telemetry history, visual QA coverage and release overview rendering after the full release gate passed.'
            merge_method = 'squash'
            sha = $env:REVIEW_HEAD
          } | ConvertTo-Json -Compress
          $response = $body | gh api --method PUT "repos/$env:GITHUB_REPOSITORY/pulls/$env:PR_NUMBER/merge" --input -
          if ($LASTEXITCODE -ne 0) { throw "GitHub rejected the tested PR merge" }
          $merge = $response | ConvertFrom-Json
          if (-not $merge.merged) { throw "PR merge failed: $($merge.message)" }
          $mergeSha = [string]$merge.sha
          if ([string]::IsNullOrWhiteSpace($mergeSha)) { throw "Merge succeeded without a merge SHA" }
          "MERGE_SHA=$mergeSha" | Out-File $env:GITHUB_ENV -Encoding utf8 -Append
          Write-Host "Merged tested review as $mergeSha"

      - name: Replace stale alpha.11 release and retarget tag
        shell: pwsh
        run: |
          $oldReleaseJson = gh api "repos/$env:GITHUB_REPOSITORY/releases/tags/$env:RELEASE_TAG" 2>$null
          if ($LASTEXITCODE -eq 0 -and $oldReleaseJson) {
            $oldRelease = $oldReleaseJson | ConvertFrom-Json
            gh api --method DELETE "repos/$env:GITHUB_REPOSITORY/releases/$($oldRelease.id)" | Out-Null
            if ($LASTEXITCODE -ne 0) { throw "Could not delete stale alpha.11 GitHub Release" }
            Write-Host "Deleted stale release $env:RELEASE_TAG"
          }

          $patchBody = @{ sha = $env:MERGE_SHA; force = $true } | ConvertTo-Json -Compress
          $tagUpdate = $patchBody | gh api --method PATCH "repos/$env:GITHUB_REPOSITORY/git/refs/tags/$env:RELEASE_TAG" --input - 2>$null
          if ($LASTEXITCODE -ne 0) {
            $createBody = @{ ref = "refs/tags/$env:RELEASE_TAG"; sha = $env:MERGE_SHA } | ConvertTo-Json -Compress
            $createBody | gh api --method POST "repos/$env:GITHUB_REPOSITORY/git/refs" --input - | Out-Null
            if ($LASTEXITCODE -ne 0) { throw "Could not create corrected alpha.11 tag" }
            Write-Host "Created $env:RELEASE_TAG at $env:MERGE_SHA"
          }
          else {
            Write-Host "Moved $env:RELEASE_TAG to $env:MERGE_SHA"
          }

      - name: Run tagged release package
        shell: pwsh
        run: |
          $taggedRun = $null
          $deadline = (Get-Date).AddSeconds(30)
          do {
            Start-Sleep -Seconds 4
            $json = gh run list --repo $env:GITHUB_REPOSITORY --workflow release.yml --commit $env:MERGE_SHA --limit 20 --json databaseId,headSha,status,conclusion,event,createdAt
            if ($LASTEXITCODE -ne 0) { throw "Could not query tagged package runs" }
            $runs = $json | ConvertFrom-Json
            $candidate = $runs | Where-Object {
              $_.headSha -eq $env:MERGE_SHA -and $_.event -eq 'push'
            } | Sort-Object { [DateTimeOffset]$_.createdAt } -Descending | Select-Object -First 1
            if ($null -ne $candidate) { $taggedRun = [string]$candidate.databaseId }
          } while (-not $taggedRun -and (Get-Date) -lt $deadline)

          if (-not $taggedRun) {
            Write-Host "No tag-push package run appeared; dispatching release.yml explicitly on $env:RELEASE_TAG"
            $started = (Get-Date).ToUniversalTime()
            gh workflow run release.yml --repo $env:GITHUB_REPOSITORY --ref $env:RELEASE_TAG
            if ($LASTEXITCODE -ne 0) { throw "Could not dispatch tagged Package ThinkControl" }
            $deadline = (Get-Date).AddMinutes(4)
            do {
              Start-Sleep -Seconds 4
              $json = gh run list --repo $env:GITHUB_REPOSITORY --workflow release.yml --commit $env:MERGE_SHA --event workflow_dispatch --limit 20 --json databaseId,headSha,status,conclusion,event,createdAt
              $runs = $json | ConvertFrom-Json
              $candidate = $runs | Where-Object {
                $_.headSha -eq $env:MERGE_SHA -and ([DateTimeOffset]$_.createdAt).UtcDateTime -ge $started.AddMinutes(-1)
              } | Sort-Object { [DateTimeOffset]$_.createdAt } -Descending | Select-Object -First 1
              if ($null -ne $candidate) { $taggedRun = [string]$candidate.databaseId }
            } while (-not $taggedRun -and (Get-Date) -lt $deadline)
          }

          if (-not $taggedRun) { throw "Tagged alpha.11 Package ThinkControl run was not found" }
          Write-Host "Tagged release run: $taggedRun"
          gh run watch $taggedRun --repo $env:GITHUB_REPOSITORY --exit-status
          if ($LASTEXITCODE -ne 0) { throw "Tagged alpha.11 Package ThinkControl failed" }
          "TAGGED_RELEASE_RUN=$taggedRun" | Out-File $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Verify published GitHub Release
        shell: pwsh
        run: |
          $refJson = gh api "repos/$env:GITHUB_REPOSITORY/git/ref/tags/$env:RELEASE_TAG"
          if ($LASTEXITCODE -ne 0) { throw "Could not resolve release tag" }
          $ref = $refJson | ConvertFrom-Json
          if ([string]$ref.object.sha -ne $env:MERGE_SHA) {
            throw "$env:RELEASE_TAG points at $($ref.object.sha), expected tested merge $env:MERGE_SHA"
          }

          $releaseJson = gh api "repos/$env:GITHUB_REPOSITORY/releases/tags/$env:RELEASE_TAG"
          if ($LASTEXITCODE -ne 0) { throw "GitHub Release $env:RELEASE_TAG does not exist" }
          $release = $releaseJson | ConvertFrom-Json
          if (-not $release.prerelease) { throw "$env:RELEASE_TAG is not marked as a prerelease" }

          $expected = @(
            'ThinkControl-Setup-0.1.0-alpha.11.exe',
            'ThinkControl-Payload-0.1.0-alpha.11.zip',
            'SHA256SUMS.txt',
            'ui-overview.png'
          )
          $actual = @($release.assets | ForEach-Object { $_.name })
          $missing = @($expected | Where-Object { $_ -notin $actual })
          if ($missing.Count -gt 0) { throw "Release is missing assets: $($missing -join ', ')" }
          foreach ($asset in $release.assets) {
            if ($asset.name -in $expected -and [int64]$asset.size -le 0) {
              throw "Release asset $($asset.name) is empty"
            }
          }

          "RELEASE_URL=$($release.html_url)" | Out-File $env:GITHUB_ENV -Encoding utf8 -Append
          Write-Host "Verified $env:RELEASE_TAG with all expected assets"

      - name: Report success and remove review branch
        shell: pwsh
        run: |
          gh pr comment $env:PR_NUMBER --repo $env:GITHUB_REPOSITORY --body "✅ ThinkControl $env:RELEASE_TAG is published from tested merge $env:MERGE_SHA. Full CI/visual QA passed, Package ThinkControl passed on the review head, the tagged installer lifecycle passed, and the release contains the installer, payload, SHA256SUMS and ui-overview assets. Release: $env:RELEASE_URL"
          git push origin --delete $env:REVIEW_BRANCH
          if ($LASTEXITCODE -ne 0) { Write-Warning "Release is complete, but the merged review branch could not be deleted automatically." }

      - name: Report failure
        if: failure()
        shell: pwsh
        run: |
          gh pr comment $env:PR_NUMBER --repo $env:GITHUB_REPOSITORY --body "❌ The alpha.11 final gate stopped before declaring the release complete. No untested PR head is intentionally merged by this workflow. Check the latest Gate and publish alpha.11 once run for the failing build/test/package/release step."
