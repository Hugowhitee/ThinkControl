name: Publish alpha.11 tag once

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/publish-alpha11-once.yml"

permissions:
  contents: write

jobs:
  tag-tested-release:
    runs-on: ubuntu-latest
    steps:
      - name: Tag the tested alpha.11 merge commit
        uses: actions/github-script@v7
        with:
          script: |
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const tag = 'v0.1.0-alpha.11';
            const sha = '5dca8571c0fdc4aed4e6b8fb13636cbac5c5500a';

            try {
              const existing = await github.rest.git.getRef({ owner, repo, ref: `tags/${tag}` });
              if (existing.data.object.sha !== sha) {
                core.setFailed(`${tag} already exists at ${existing.data.object.sha}, expected ${sha}`);
                return;
              }
              core.info(`${tag} already points at the tested merge commit; nothing to do.`);
            } catch (error) {
              if (error.status !== 404) throw error;
              await github.rest.git.createRef({ owner, repo, ref: `refs/tags/${tag}`, sha });
              core.info(`Created ${tag} at ${sha}`);
            }
