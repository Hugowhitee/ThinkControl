name: Device support
about: Help ThinkControl validate a new laptop safely
body:
  - type: markdown
    attributes:
      value: |
        Use **Settings → Compatibility diagnostics → Share device report** when possible. ThinkControl pre-fills a hardware-only capability summary and excludes serial numbers, usernames, hostnames, personal paths and raw logs.
  - type: input
    id: device
    attributes:
      label: Laptop model
      placeholder: Lenovo ThinkPad X9-15 Gen 1
    validations:
      required: true
  - type: input
    id: machine
    attributes:
      label: Machine type / model code
      description: Do not enter a serial number.
      placeholder: 21Q6
  - type: textarea
    id: capabilities
    attributes:
      label: ThinkControl capability result
      description: Paste the sanitized capability section generated by ThinkControl, or describe which sensors / fan RPM / keyboard / haptics work.
    validations:
      required: true
  - type: textarea
    id: physical
    attributes:
      label: What did you physically verify?
      description: For example RPM follows fan sound, keyboard Low/High reads back correctly, or touchpad haptics respond.
  - type: checkboxes
    id: privacy
    attributes:
      label: Privacy check
      options:
        - label: I removed serial numbers, account names, hostnames and unrelated personal data.
          required: true
        - label: I understand ThinkControl will not enable unknown EC/PWM writes from this report alone; write support requires a reviewed device profile.
          required: true
